# Append to ~/.codex/config.toml (Windows: %USERPROFILE%\.codex\config.toml).
# Capture hooks live in the repository's .codex/hooks.json, written by
# `continuum coding setup` (trust them once with /hooks in Codex).

[mcp_servers.continuum]
command = "continuum"
args = ["mcp"]

[mcp_servers.continuum.env]
CONTINUUM_DATABASE_URL = "postgresql://continuum:continuum@localhost:5432/continuum"

# Only for a Codex without hooks: `notify` journals each turn (your words and the agent's
# report, no tool calls). It must be a top-level key, above any [table]:
# notify = ["continuum", "hook", "codex"]
