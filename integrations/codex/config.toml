# Append to ~/.codex/config.toml (Windows: %USERPROFILE%\.codex\config.toml).
# `notify` must be a top-level key: put it above any [table] in your config.
# It journals each turn (your words and the agent's report) so another app can continue.
notify = ["continuum", "hook", "codex"]

[mcp_servers.continuum]
command = "continuum"
args = ["mcp"]

[mcp_servers.continuum.env]
CONTINUUM_DATABASE_URL = "postgresql://continuum:continuum@localhost:5432/continuum"
