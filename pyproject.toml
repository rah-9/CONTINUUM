[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "continuum"
version = "0.1.0"
description = "Model-agnostic agent continuity runtime: durable verified state and an external-effect ledger."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
dependencies = [
  "pydantic>=2.7,<3",
  "psycopg[binary]>=3.2,<4",
  "psycopg-pool>=3.2,<4",
  "jsonschema>=4.22,<5",
  "PyYAML>=6.0,<7",
]

[project.optional-dependencies]
http = ["fastapi>=0.115", "uvicorn>=0.30"]
live = ["litellm>=1.50"]
mcp = ["mcp>=2,<3"]
dev = [
  "pytest>=8",
  "hypothesis>=6.100",
  "ruff>=0.6",
  "mypy>=1.11",
  "types-PyYAML",
  "httpx>=0.27",
  "fastapi>=0.115",
  "uvicorn>=0.30",
]

[project.scripts]
continuum = "continuum.interfaces.cli:main"
continuum-lab = "continuum_lab.runner:main"

[tool.hatch.build.targets.wheel]
packages = ["src/continuum", "eval/continuum_lab"]

[tool.hatch.build.targets.wheel.force-include]
"src/continuum/core/schema.sql" = "continuum/core/schema.sql"

[tool.hatch.build]
dev-mode-dirs = ["src", "eval"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
  "live: opt-in tests that call real model providers (cost money)",
  "chaos: process-level crash and concurrency tests",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "eval", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "S", "PT"]
ignore = [
  "S101",   # assert is fine in tests and invariant checks
  "S608",   # SQL is built only from internal constant identifiers
  "RUF012",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "PT011", "PT012", "PT018"]
"eval/**" = ["S311"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = ["src", "eval"]
packages = ["continuum", "continuum_lab"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["litellm.*", "jsonschema.*", "mcp.*", "uvicorn.*"]
ignore_missing_imports = true
